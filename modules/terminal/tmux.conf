# Bubble Gum Rave tmux — managed by deckctl.
# This file is sourced from a small marker-managed block in ~/.tmux.conf.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",xterm*:clipboard"
set -s set-clipboard external
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g display-time 1500
set -g display-panes-time 1500
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

set -g prefix C-a
unbind C-b
bind C-a send-prefix

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind z resize-pane -Z

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#090612,fg=#f8e7ff"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bold,fg=#ff4fd8]  #S #[default]"
set -g status-right "#[fg=#b9a8ca]#H  %H:%M "
setw -g window-status-format "#[fg=#b9a8ca] #I:#W "
setw -g window-status-current-format "#[bold,fg=#42f5ff] #I:#W #[default]"
setw -g pane-border-style "fg=#6f4a8e"
setw -g pane-active-border-style "fg=#42f5ff"
set -g message-style "bg=#241332,fg=#42f5ff"
set -g message-command-style "bg=#241332,fg=#ff4fd8"
setw -g mode-style "bg=#241332,fg=#42f5ff"
setw -g allow-rename off
